[project]
name = "phi4-mini-instruct"
version = "0.1.0"
description = "Local OpenVINO and ONNX GenAI inference"
authors = [{name = "HAT Inc.", email = "maintainer@example.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "onnxruntime-genai>=0.17.1,<0.18",
    "openvino-genai>=2026.4.1.0,<2027",
]

[tool.poetry]
packages = [{include = "phi4_mini_instruct", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
