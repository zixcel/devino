[project]
name = "load-models"
version = "0.1.0"
description = "Explicit model export environment"
authors = [{name = "HAT Inc.", email = "maintainer@example.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub>=1.0,<1.22",
    "nncf>=3.4,<4",
    "onnx>=1.23.2,<2",
    "onnxruntime>=1.30,<2",
    "openvino>=2026.4.1,<2027",
    "openvino-tokenizers>=2026.4.1.0,<2027",
    "transformers==5.5.4",
    "optimum==2.3.0",
    "optimum-intel[openvino]==2.2.0",
    "torch>=2.14.1,<3",
    "numpy>=2,<2.5",
]

[tool.poetry]
packages = [{include = "load_models", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
