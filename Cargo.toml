[package]
name = "devino"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Bounded OpenVINO CPU backend for verified local model bundles"
repository = "https://github.com/zixcel/devino"
readme = "README.md"
publish = ["crates-io"]
keywords = ["openvino", "inference", "local-first", "llm"]
categories = ["science", "api-bindings"]
include = ["src/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
zixcel-local-inference = "=0.11.0"
openvino = { version = "=0.11.1", features = ["runtime-linking"] }
openvino-sys = { version = "=0.11.1", features = ["runtime-linking"] }
openvino-genai = { version = "=0.11.1", features = ["runtime-linking"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
